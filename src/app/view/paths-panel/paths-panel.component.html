<div class="paths-panel-container">
  <div class="paths-group">
    <div class="group-title">Папка проекта</div>

    <div class="path-row">
      <label class="path-label" for="projectDirInput">Проект:</label>
      <input
        id="projectDirInput"
        type="text"
        class="form-control path-input"
        [value]="state.rootPath()"
        (input)="onProjectDirChange($event)"
        placeholder="Выберите папку проекта через кнопку или перетащите в окно..."
      />
      <button
        type="button"
        class="btn btn-icon"
        (click)="browseProjectDir()"
        title="Обзор папки проекта..."
      >
        <span class="icon icon-folder-open"></span>
      </button>
    </div>
  </div>
</div>
