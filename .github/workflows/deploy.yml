name: Deploy to GitHub Pages & Package UI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Скачиваем готовый WASM из релизов ядра
      - name: Download WASM from Core Releases
        env:
          GH_TOKEN: ${{ secrets.CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/assets/wasm
          gh release download --repo CogniDevs/codecontext-core --pattern "codecontext_wasm.tar.gz" --dir /tmp || true
          if [ -f /tmp/codecontext_wasm.tar.gz ]; then
            tar -xzf /tmp/codecontext_wasm.tar.gz -C public/assets/wasm/
          fi

      - name: Install dependencies
        run: npm ci

      # Исправлен base-href под имя нового репозитория codecontext-web
      - name: Build Angular SPA
        run: npx ng build --configuration production --base-href=/codecontext-web/

      # 1. Загрузка для GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/codecontext-web/browser

      # 2. Упаковка готового dist для десктопа
      - name: Package Dist for Desktop
        run: |
          cd dist/codecontext-web/browser
          zip -r ../../../frontend-dist.zip .

      - name: Release Dist for Desktop
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-ui
          name: Latest UI Build for Desktop
          files: frontend-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4